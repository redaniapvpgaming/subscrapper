name: macOS smoke test

on:
  push:
  workflow_dispatch:

jobs:
  macos-smoke:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out test repo
        uses: actions/checkout@v4

      - name: Clone SubScraper source
        run: git clone https://git.subnabbit.com/subscraper/subscraper src

      - name: Apply macOS patch
        run: |
          cd src
          git apply --check ../subscraper-macos.patch
          git apply ../subscraper-macos.patch

      - name: Apply Discord webhook patch
        run: |
          cd src
          git apply --check ../discord-webhook.patch
          git apply ../discord-webhook.patch

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish GUI (osx-arm64)
        run: |
          cd src
          dotnet publish SubScraper.Gui/SubScraper.Gui.csproj \
            -c Release -r osx-arm64 --self-contained \
            -p:PublishSingleFile=true \
            -o ../outosx-arm64-gui

      - name: Publish Classic CLI (osx-arm64)
        run: |
          cd src
          dotnet publish SubScraper.Cli/SubScraper.Cli.csproj \
            -c Release -r osx-arm64 --self-contained \
            -p:PublishSingleFile=true \
            -o ../outosx-arm64-cli

      - name: Verify Mach-O arm64 binaries
        run: |
          file outosx-arm64-gui/SubScraper.Gui
          file outosx-arm64-cli/SubScraper.Cli
          test -x outosx-arm64-gui/SubScraper.Gui
          test -x outosx-arm64-cli/SubScraper.Cli

      - name: Package SubScraper.app
        run: |
          cd src
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh \
            "$GITHUB_WORKSPACE/outosx-arm64-gui" \
            "1.0.13-test" \
            "$GITHUB_WORKSPACE/release-macos"

      - name: Validate .app bundle
        run: |
          APP="$GITHUB_WORKSPACE/release-macos/SubScraper.app"
          test -x "$APP/Contents/MacOS/SubScraper"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/MacOS/rules.json"
          test -f "$APP/Contents/MacOS/chromium-scripts/stealth.min.js"
          test -d "$APP/Contents/MacOS/.playwright"
          plutil -p "$APP/Contents/Info.plist" | grep -q "13.0"
          file "$APP/Contents/MacOS/SubScraper"

      - name: Test real ffmpeg bootstrap (new macOS code path)
        run: |
          cat > src/SubScraper.Tests/Services/RealMacOSBootstrapTests.cs <<'EOF'
          using SubScraper.Services;
          namespace SubScraper.Tests.Services;
          public class RealMacOSBootstrapTests
          {
              [Fact]
              public async Task RealMacOSBootstrap_DownloadsMachOArm64Binaries()
              {
                  var svc = new FfmpegBootstrapService();
                  var result = await svc.EnsureInstalledAsync();
                  Assert.True(result.Success, $"bootstrap failed: {result.Error}");
                  Assert.True(File.Exists(result.FfmpegPath), "ffmpeg missing");
                  Assert.True(File.Exists(result.FfprobePath), "ffprobe missing");
                  Console.WriteLine($"FFMPEG_PATH={result.FfmpegPath}");
                  Console.WriteLine($"FFPROBE_PATH={result.FfprobePath}");
                  File.WriteAllText("/tmp/ffbin-dir.txt", Path.GetDirectoryName(result.FfmpegPath)!);
                  foreach (string? path in new[] { result.FfmpegPath, result.FfprobePath })
                  {
                      byte[] magic = new byte[4];
                      using (FileStream fs = File.OpenRead(path!))
                      {
                          fs.ReadExactly(magic);
                      }
                      bool isMachO = (magic[0] == 0xCF && magic[1] == 0xFA && magic[2] == 0xED && magic[3] == 0xFE) ||
                                     (magic[0] == 0xFE && magic[1] == 0xED && magic[2] == 0xFA && magic[3] == 0xCF);
                      Assert.True(isMachO, $"{path} is not a Mach-O binary");
                  }
              }
          }
          EOF
          cd src
          dotnet test SubScraper.Tests/SubScraper.Tests.csproj --filter "FullyQualifiedName~RealMacOSBootstrap" -v minimal

      - name: Verify bootstrapped Mach-O ffmpeg
        run: |
          BIN="$(cat /tmp/ffbin-dir.txt)"
          echo "ffmpeg bin dir: $BIN"
          ls -la "$BIN/ffmpeg" "$BIN/ffprobe"
          file "$BIN/ffmpeg"
          test -x "$BIN/ffmpeg" && test -x "$BIN/ffprobe"
          "$BIN/ffmpeg" -version 2>&1 | head -2

      - name: Test Playwright Chromium launch (browser stack for login)
        run: |
          cat > src/SubScraper.Tests/Services/RealMacOSBrowserTests.cs <<'EOF'
          using Microsoft.Playwright;
          namespace SubScraper.Tests.Services;
          public class RealMacOSBrowserTests
          {
              [Fact]
              public async Task Playwright_CanLaunchChromiumHeadless()
              {
                  int exitCode = await Task.Run(() => Program.Main(new[] { "install", "chromium" }));
                  Assert.Equal(0, exitCode);
                  using IPlaywright playwright = await Playwright.CreateAsync();
                  await using IBrowser browser = await playwright.Chromium.LaunchAsync(new BrowserTypeLaunchOptions
                  {
                      Headless = true,
                      Args = new[] { "--no-sandbox", "--disable-setuid-sandbox" }
                  });
                  IPage page = await browser.NewPageAsync();
                  await page.GotoAsync("https://example.com");
                  string title = await page.TitleAsync();
                  Assert.Contains("Example", title, StringComparison.OrdinalIgnoreCase);
              }
          }
          EOF
          cd src
          dotnet test SubScraper.Tests/SubScraper.Tests.csproj --filter "FullyQualifiedName~RealMacOSBrowser" -v minimal

      - name: CLI startup gate (ffmpeg on PATH)
        run: |
          cd "$GITHUB_WORKSPACE/release-macos"
          export PATH="$(cat /tmp/ffbin-dir.txt):$PATH"
          cp "$GITHUB_WORKSPACE/outosx-arm64-cli/SubScraper.Cli" "./SubScraper - Classic"
          mkdir -p chromium-scripts
          cp "$GITHUB_WORKSPACE/src/chromium-scripts/stealth.min.js" ./chromium-scripts/ 2>/dev/null || true
          chmod +x "SubScraper - Classic"
          set +e
          ./"SubScraper - Classic" --non-interactive > /tmp/cli-out.txt 2>&1
          CODE=$?
          set -e
          cat /tmp/cli-out.txt
          echo "exit=$CODE"
          if [ "$CODE" -eq 4 ]; then echo "FAIL: ffmpeg startup gate not passed"; exit 1; fi
          if grep -q "could not be found" /tmp/cli-out.txt; then echo "FAIL: ffmpeg reported missing"; exit 1; fi
          echo "OK: ffmpeg gate passed (auth failure expected without credentials)"
