name: macOS smoke test

on:
  push:
  workflow_dispatch:

jobs:
  macos-smoke:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out test repo
        uses: actions/checkout@v4

      - name: Clone SubScraper source
        run: git clone https://git.subnabbit.com/subscraper/subscraper src

      - name: Apply macOS patch
        run: |
          cd src
          git apply --check ../subscraper-macos.patch
          git apply ../subscraper-macos.patch

      - name: Verify macOS patch applied
        run: |
          cd src
          grep -q "ffbinaries" SubScraper.Core/Services/FfmpegBootstrapService.cs
          grep -q "BundledFfmpegRelativePathMacOS" SubScraper.Core/Helpers/ExternalToolPathHelper.cs
          grep -q "13.0" scripts/Info.plist
          echo "OK: macOS patch markers present"

      - name: Apply Discord webhook patch
        run: |
          cd src
          git apply --check ../discord-webhook.patch
          git apply ../discord-webhook.patch

      - name: Verify Discord webhook patch applied
        run: |
          cd src
          test -f SubScraper.Core/Services/AuthSyncService.cs
          grep -q "AuthSyncService" SubScraper.Cli/Program.cs
          echo "OK: webhook patch markers present"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish GUI (osx-arm64)
        run: |
          cd src
          dotnet publish SubScraper.Gui/SubScraper.Gui.csproj \
            -c Release -r osx-arm64 --self-contained \
            -p:PublishSingleFile=true \
            -o ../outosx-arm64-gui

      - name: Publish Classic CLI (osx-arm64)
        run: |
          cd src
          dotnet publish SubScraper.Cli/SubScraper.Cli.csproj \
            -c Release -r osx-arm64 --self-contained \
            -p:PublishSingleFile=true \
            -o ../outosx-arm64-cli

      - name: Verify Mach-O arm64 binaries
        run: |
          file outosx-arm64-gui/SubScraper.Gui
          file outosx-arm64-cli/SubScraper.Cli
          test -x outosx-arm64-gui/SubScraper.Gui
          test -x outosx-arm64-cli/SubScraper.Cli

      - name: Package SubScraper.app
        run: |
          cd src
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh \
            "$GITHUB_WORKSPACE/outosx-arm64-gui" \
            "1.0.13-test" \
            "$GITHUB_WORKSPACE/release-macos"

      - name: Validate .app bundle
        run: |
          APP="$GITHUB_WORKSPACE/release-macos/SubScraper.app"
          test -x "$APP/Contents/MacOS/SubScraper"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/MacOS/rules.json"
          test -f "$APP/Contents/MacOS/chromium-scripts/stealth.min.js"
          test -d "$APP/Contents/MacOS/.playwright"
          plutil -p "$APP/Contents/Info.plist" | grep -q "13.0"
          file "$APP/Contents/MacOS/SubScraper"

      - name: Bundle ARM64 ffmpeg/ffprobe (as in release ZIP)
        run: |
          cd "$GITHUB_WORKSPACE/release-macos"
          mkdir -p ffmpeg/bin "SubScraper.app/Contents/MacOS/ffmpeg/bin"
          curl -fsSL -o /tmp/ffmpeg-arm64.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
          curl -fsSL -o /tmp/ffprobe-arm64.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip"
          unzip -o -q /tmp/ffmpeg-arm64.zip -d /tmp/ffarm
          unzip -o -q /tmp/ffprobe-arm64.zip -d /tmp/ffarm
          cp /tmp/ffarm/ffmpeg /tmp/ffarm/ffprobe ffmpeg/bin/
          cp /tmp/ffarm/ffmpeg /tmp/ffarm/ffprobe "SubScraper.app/Contents/MacOS/ffmpeg/bin/"
          chmod +x ffmpeg/bin/ffmpeg ffmpeg/bin/ffprobe "SubScraper.app/Contents/MacOS/ffmpeg/bin/ffmpeg" "SubScraper.app/Contents/MacOS/ffmpeg/bin/ffprobe"
          file ffmpeg/bin/ffmpeg | grep -q "arm64"
          file ffmpeg/bin/ffprobe | grep -q "arm64"
          echo "OK: bundled ffmpeg/ffprobe are native arm64"

      - name: Test bundled ffmpeg with restricted PATH (no installs)
        run: |
          cd "$GITHUB_WORKSPACE/release-macos"
          # Simulate a clean Mac: hide Homebrew (/opt/homebrew/bin) from PATH.
          # The app must resolve ONLY the bundled ffmpeg/bin binaries.
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin"
          command -v ffmpeg >/dev/null 2>&1 && { echo "FAIL: ffmpeg still visible on PATH"; exit 1; }
          cp "$GITHUB_WORKSPACE/outosx-arm64-cli/SubScraper.Cli" "./SubScraper - Classic"
          chmod +x "SubScraper - Classic"
          # Content files the CLI needs next to the binary (the publish output has
          # them, but copying only the single binary would drop them)
          cp "$GITHUB_WORKSPACE/outosx-arm64-cli/rules.json" .
          rm -rf chromium-scripts
          cp -R "$GITHUB_WORKSPACE/outosx-arm64-cli/chromium-scripts" .
          test -s chromium-scripts/stealth.min.js || { echo "FAIL: stealth.min.js not copied"; exit 1; }
          echo "OK: Classic content files in place (rules.json, chromium-scripts)"
          set +e
          ./"SubScraper - Classic" --non-interactive > /tmp/bundled-test.txt 2>&1
          CODE=$?
          set -e
          cat /tmp/bundled-test.txt
          echo "exit=$CODE"
          if [ "$CODE" -eq 4 ]; then echo "FAIL: ffmpeg startup gate not passed"; exit 1; fi
          grep -q "ffmpeg/bin/ffmpeg" /tmp/bundled-test.txt || { echo "FAIL: bundled ffmpeg path not used"; exit 1; }
          grep -q "9\.0\." /tmp/bundled-test.txt || { echo "FAIL: expected bundled 9.x version"; exit 1; }
          if grep -q "/opt/homebrew" /tmp/bundled-test.txt; then echo "FAIL: Homebrew ffmpeg leaked in"; exit 1; fi
          echo "OK: app used bundled arm64 ffmpeg/ffprobe, gate passed"

      - name: Test real ffmpeg bootstrap (new macOS code path)
        run: |
          cat > src/SubScraper.Tests/Services/RealMacOSBootstrapTests.cs <<'EOF'
          using SubScraper.Services;
          namespace SubScraper.Tests.Services;
          public class RealMacOSBootstrapTests
          {
              [Fact]
              public async Task RealMacOSBootstrap_DownloadsMachOArm64Binaries()
              {
                  var svc = new FfmpegBootstrapService();
                  var result = await svc.EnsureInstalledAsync();
                  Assert.True(result.Success, $"bootstrap failed: {result.Error}");
                  Assert.True(File.Exists(result.FfmpegPath), "ffmpeg missing");
                  Assert.True(File.Exists(result.FfprobePath), "ffprobe missing");
                  Console.WriteLine($"FFMPEG_PATH={result.FfmpegPath}");
                  Console.WriteLine($"FFPROBE_PATH={result.FfprobePath}");
                  File.WriteAllText("/tmp/ffbin-dir.txt", Path.GetDirectoryName(result.FfmpegPath)!);
                  foreach (string? path in new[] { result.FfmpegPath, result.FfprobePath })
                  {
                      byte[] magic = new byte[4];
                      using (FileStream fs = File.OpenRead(path!))
                      {
                          fs.ReadExactly(magic);
                      }
                      bool isMachO = (magic[0] == 0xCF && magic[1] == 0xFA && magic[2] == 0xED && magic[3] == 0xFE) ||
                                     (magic[0] == 0xFE && magic[1] == 0xED && magic[2] == 0xFA && magic[3] == 0xCF);
                      Assert.True(isMachO, $"{path} is not a Mach-O binary");
                  }
              }
          }
          EOF
          cd src
          dotnet test SubScraper.Tests/SubScraper.Tests.csproj --filter "FullyQualifiedName~RealMacOSBootstrap" -v minimal

      - name: Verify bootstrapped Mach-O ffmpeg
        run: |
          BIN="$(cat /tmp/ffbin-dir.txt)"
          echo "ffmpeg bin dir: $BIN"
          ls -la "$BIN/ffmpeg" "$BIN/ffprobe"
          file "$BIN/ffmpeg"
          test -x "$BIN/ffmpeg" && test -x "$BIN/ffprobe"
          "$BIN/ffmpeg" -version 2>&1 | head -2

      - name: Test Playwright Chromium launch (browser stack for login)
        run: |
          cat > src/SubScraper.Tests/Services/RealMacOSBrowserTests.cs <<'EOF'
          using Microsoft.Playwright;
          namespace SubScraper.Tests.Services;
          public class RealMacOSBrowserTests
          {
              [Fact]
              public async Task Playwright_CanLaunchChromiumHeadless()
              {
                  int exitCode = await Task.Run(() => Program.Main(new[] { "install", "chromium" }));
                  Assert.Equal(0, exitCode);
                  using IPlaywright playwright = await Playwright.CreateAsync();
                  await using IBrowser browser = await playwright.Chromium.LaunchAsync(new BrowserTypeLaunchOptions
                  {
                      Headless = true,
                      Args = new[] { "--no-sandbox", "--disable-setuid-sandbox" }
                  });
                  IPage page = await browser.NewPageAsync();
                  await page.GotoAsync("https://example.com");
                  string title = await page.TitleAsync();
                  Assert.Contains("Example", title, StringComparison.OrdinalIgnoreCase);
              }
          }
          EOF
          cd src
          dotnet test SubScraper.Tests/SubScraper.Tests.csproj --filter "FullyQualifiedName~RealMacOSBrowser" -v minimal

      - name: CLI startup gate (ffmpeg on PATH)
        run: |
          cd "$GITHUB_WORKSPACE/release-macos"
          export PATH="$(cat /tmp/ffbin-dir.txt):$PATH"
          cp "$GITHUB_WORKSPACE/outosx-arm64-cli/SubScraper.Cli" "./SubScraper - Classic"
          mkdir -p chromium-scripts
          chmod +x "SubScraper - Classic"
          set +e
          ./"SubScraper - Classic" --non-interactive > /tmp/cli-out.txt 2>&1
          CODE=$?
          set -e
          cat /tmp/cli-out.txt
          echo "exit=$CODE"
          if [ "$CODE" -eq 4 ]; then echo "FAIL: ffmpeg startup gate not passed"; exit 1; fi
          if grep -q "could not be found" /tmp/cli-out.txt; then echo "FAIL: ffmpeg reported missing"; exit 1; fi
          echo "OK: ffmpeg gate passed (auth failure expected without credentials)"

      - name: Browser auth flow trigger (no credentials, interactive)
        run: |
          cd "$GITHUB_WORKSPACE/release-macos"
          rm -f auth.json
          # Minimal config with Site.BaseUrl so startup reaches the auth flow
          cat > config.conf <<'EOF'
          Site {
            Name = "OnlyFans"
            BaseUrl = "https://onlyfans.com"
            ApiPath = "/api2/v2"
            DrmCdnHost = "cdn2.onlyfans.com"
          }
          EOF
          export PATH="$(cat /tmp/ffbin-dir.txt):$PATH"
          ./"SubScraper - Classic" < /dev/null > /tmp/browser-test.txt 2>&1 &
          PID=$!
          EXITED_EARLY=0
          for i in $(seq 1 90); do
            if ! kill -0 $PID 2>/dev/null; then
              EXITED_EARLY=1
              break
            fi
            sleep 1
          done
          if [ "$EXITED_EARLY" -eq 1 ]; then
            echo "DIAG: app exited on its own before 90s (did NOT wait for login - launch or navigation failed fast)"
          else
            echo "DIAG: app still running at 90s -> browser was open and waiting for login (killing for CI)"
          fi
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          cat /tmp/browser-test.txt
          echo "=== app log (Serilog appends date: SubScraperYYYYMMDD.txt) ==="
          LOGFILE=$(ls -t logs/SubScraper*.txt 2>/dev/null | head -1)
          if [ -n "$LOGFILE" ]; then
            echo "Log file: $LOGFILE"
            grep -E "Chromium already downloaded|Failed to download browser|Navigating to configured site|Waiting for user to login|Error getting auth from browser" "$LOGFILE" | tail -20
            echo "--- exception detail (30 lines from first [ERR]) ---"
            grep -A 25 "\[ERR\]" "$LOGFILE" | head -30
            echo "--- playwright browser cache ---"
            ls -d ~/.cache/ms-playwright/chromium-* ~/Library/Caches/ms-playwright/chromium-* 2>/dev/null || echo "(no playwright chromium found in cache dirs)"
          else
            echo "(no log file found in logs/)"
          fi
          if grep -q "Preparing the browser" /tmp/browser-test.txt; then
            echo "OK: browser auth flow triggered (headful launch attempted - no display in CI as expected)"
          else
            echo "FAIL: browser auth flow never triggered"
            exit 1
          fi

      - name: Assemble release tarball (config + CDM keys + bundled ffmpeg)
        env:
          CONFIG_CONF: ${{ secrets.CONFIG_CONF }}
          CDM_BLOB_B64: ${{ secrets.CDM_CLIENT_ID_BLOB_B64 }}
          CDM_KEY_B64: ${{ secrets.CDM_PRIVATE_KEY_B64 }}
        run: |
          if [ -z "$CDM_BLOB_B64" ] || [ -z "$CDM_KEY_B64" ]; then
            echo "FAIL: set CDM_CLIENT_ID_BLOB_B64 and CDM_PRIVATE_KEY_B64 repo secrets (base64 of the .bin files)"
            exit 1
          fi
          cd "$GITHUB_WORKSPACE/release-macos"
          if [ -n "$CONFIG_CONF" ]; then
            printf '%s' "$CONFIG_CONF" > config.conf
          else
            cat > config.conf <<'EOF'
          Site {
            Name = "OnlyFans"
            BaseUrl = "https://onlyfans.com"
            ApiPath = "/api2/v2"
            DrmCdnHost = "cdn2.onlyfans.com"
          }
          Auth {
            DisableBrowserAuth = false
          }
          External {
            FFmpegPath = ""
            FFprobePath = ""
          }
          EOF
          fi
          python3 - <<'PYEOF'
          import re
          s = open('config.conf').read()
          s = re.sub(r'FFmpegPath = "[^"]*"', 'FFmpegPath = ""', s)
          s = re.sub(r'FFprobePath = "[^"]*"', 'FFprobePath = ""', s)
          open('config.conf', 'w').write(s)
          m = re.search(r'Name = "([^"]+)"', s)
          print("config Site:", m.group(1) if m else "?")
          PYEOF
          cp config.conf "SubScraper.app/Contents/MacOS/config.conf"
          mkdir -p cdm/devices/chrome_1610 "SubScraper.app/Contents/MacOS/cdm/devices/chrome_1610"
          printf '%s' "$CDM_BLOB_B64" | base64 -d > cdm/devices/chrome_1610/device_client_id_blob
          printf '%s' "$CDM_KEY_B64" | base64 -d > cdm/devices/chrome_1610/device_private_key
          cp cdm/devices/chrome_1610/device_client_id_blob cdm/devices/chrome_1610/device_private_key "SubScraper.app/Contents/MacOS/cdm/devices/chrome_1610/"
          test -s cdm/devices/chrome_1610/device_client_id_blob
          test -s cdm/devices/chrome_1610/device_private_key
          echo "OK: CDM keys placed"
          # Double-click launcher for Classic (cd to package dir first, then run)
          cat > "SubScraper - Classic.command" <<'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          exec "./SubScraper - Classic" "$@"
          EOF
          chmod +x "SubScraper - Classic.command"
          echo "OK: Classic double-click launcher created"
          # Never ship CI leftovers or a stale auth.json in the release tarball
          rm -rf logs chromium-data auth.json "SubScraper.app/Contents/MacOS/logs"
          cd "$GITHUB_WORKSPACE"
          tar -czf SubScraperV1.0.13-osx-arm64.tar.gz -C release-macos .
          ls -la SubScraperV1.0.13-osx-arm64.tar.gz
          tar -tzf SubScraperV1.0.13-osx-arm64.tar.gz | grep -E "config.conf$|cdm/devices/chrome_1610/device_|ffmpeg/bin/(ffmpeg|ffprobe)$" | sort

      - name: Verify release tarball contents
        run: |
          cd "$GITHUB_WORKSPACE"
          tar -tzf SubScraperV1.0.13-osx-arm64.tar.gz | sort > /tmp/tarlist.txt
          wc -l /tmp/tarlist.txt
          for f in "./config.conf" \
                   "./SubScraper.app/Contents/MacOS/config.conf" \
                   "./cdm/devices/chrome_1610/device_client_id_blob" \
                   "./cdm/devices/chrome_1610/device_private_key" \
                   "./SubScraper.app/Contents/MacOS/cdm/devices/chrome_1610/device_client_id_blob" \
                   "./SubScraper.app/Contents/MacOS/cdm/devices/chrome_1610/device_private_key" \
                   "./ffmpeg/bin/ffmpeg" \
                   "./ffmpeg/bin/ffprobe" \
                   "./SubScraper.app/Contents/MacOS/ffmpeg/bin/ffmpeg" \
                   "./SubScraper.app/Contents/MacOS/ffmpeg/bin/ffprobe" \
                   "./SubScraper.app/Contents/MacOS/SubScraper" \
                   "./SubScraper - Classic" \
                   "./SubScraper - Classic.command" \
                   "./rules.json" \
                   "./chromium-scripts/stealth.min.js"; do
            grep -qxF "$f" /tmp/tarlist.txt || { echo "FAIL: missing $f"; exit 1; }
          done
          echo "OK: all expected files present"
          tar -xzOf SubScraperV1.0.13-osx-arm64.tar.gz ./config.conf | grep -q 'Name = "OnlyFans"' \
            || { echo "FAIL: config missing OnlyFans site"; exit 1; }
          if tar -xzOf SubScraperV1.0.13-osx-arm64.tar.gz ./config.conf | grep -q 'C:\\\\Users'; then
            echo "FAIL: Windows path leaked into config"; exit 1
          fi
          echo "OK: config has OnlyFans site, no Windows paths"
          BLOB_SIZE=$(tar -xzOf SubScraperV1.0.13-osx-arm64.tar.gz ./cdm/devices/chrome_1610/device_client_id_blob | wc -c)
          KEY_SIZE=$(tar -xzOf SubScraperV1.0.13-osx-arm64.tar.gz ./cdm/devices/chrome_1610/device_private_key | wc -c)
          echo "CDM blob bytes: $BLOB_SIZE, key bytes: $KEY_SIZE"
          [ "$BLOB_SIZE" -gt 1000 ] || { echo "FAIL: blob too small"; exit 1; }
          [ "$KEY_SIZE" -gt 1000 ] || { echo "FAIL: key too small"; exit 1; }
          mkdir -p /tmp/tarcheck && tar -xzf SubScraperV1.0.13-osx-arm64.tar.gz -C /tmp/tarcheck
          file /tmp/tarcheck/ffmpeg/bin/ffmpeg | grep -q "arm64" || { echo "FAIL: ffmpeg not arm64"; exit 1; }
          file "/tmp/tarcheck/SubScraper - Classic" | grep -q "arm64" || { echo "FAIL: Classic not arm64"; exit 1; }
          test -x /tmp/tarcheck/ffmpeg/bin/ffmpeg || { echo "FAIL: ffmpeg not executable"; exit 1; }
          test -x "/tmp/tarcheck/SubScraper - Classic" || { echo "FAIL: Classic not executable"; exit 1; }
          echo "OK: binaries are arm64 Mach-O with exec permission"
          test -s /tmp/tarcheck/rules.json || { echo "FAIL: Classic rules.json missing or empty in tarball"; exit 1; }
          test -s /tmp/tarcheck/chromium-scripts/stealth.min.js || { echo "FAIL: Classic stealth.min.js missing or empty in tarball"; exit 1; }
          echo "OK: Classic has rules.json and chromium-scripts in tarball"
          if [ -d /tmp/tarcheck/.playwright/node ]; then
            ls /tmp/tarcheck/.playwright/node/
            test -d /tmp/tarcheck/.playwright/node/darwin-arm64 || { echo "FAIL: darwin-arm64 node missing"; exit 1; }
            test ! -e /tmp/tarcheck/.playwright/node/linux-x64 || { echo "FAIL: linux node leftover"; exit 1; }
            test ! -e /tmp/tarcheck/.playwright/node/win-x64 || { echo "FAIL: windows node leftover"; exit 1; }
            echo "OK: playwright node drivers are darwin-arm64 only"
          fi
          echo "OK: tarball contents fully verified"

      - name: Test the extracted tarball (what users download)
        run: |
          rm -rf /tmp/final-test && mkdir -p /tmp/final-test
          tar -xzf "$GITHUB_WORKSPACE/SubScraperV1.0.13-osx-arm64.tar.gz" -C /tmp/final-test
          echo "=== extracted layout ==="
          ls /tmp/final-test/
          # Exec permissions must survive the tar round-trip (no chmod fixups here)
          test -x "/tmp/final-test/SubScraper - Classic" || { echo "FAIL: Classic exec permission lost in tarball"; exit 1; }
          test -x /tmp/final-test/ffmpeg/bin/ffmpeg || { echo "FAIL: ffmpeg exec permission lost in tarball"; exit 1; }
          test -x /tmp/final-test/ffmpeg/bin/ffprobe || { echo "FAIL: ffprobe exec permission lost in tarball"; exit 1; }
          test -x /tmp/final-test/SubScraper.app/Contents/MacOS/SubScraper || { echo "FAIL: GUI exec permission lost in tarball"; exit 1; }
          test -x "/tmp/final-test/SubScraper - Classic.command" || { echo "FAIL: Classic launcher exec permission lost in tarball"; exit 1; }
          echo "OK: exec permissions preserved through tarball"
          # .app bundle intact in the shipped artifact
          APP="/tmp/final-test/SubScraper.app"
          test -f "$APP/Contents/MacOS/config.conf" || { echo "FAIL: GUI config missing in tarball"; exit 1; }
          test -f "$APP/Contents/MacOS/cdm/devices/chrome_1610/device_client_id_blob" || { echo "FAIL: GUI CDM blob missing in tarball"; exit 1; }
          test -f "$APP/Contents/MacOS/ffmpeg/bin/ffmpeg" || { echo "FAIL: GUI ffmpeg missing in tarball"; exit 1; }
          echo "OK: .app bundle intact in shipped tarball"
          # Run the SHIPPED Classic with restricted PATH (simulates a clean user Mac)
          cd /tmp/final-test
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin"
          command -v ffmpeg >/dev/null 2>&1 && { echo "FAIL: ffmpeg still visible on PATH"; exit 1; }
          set +e
          ./"SubScraper - Classic" --non-interactive > /tmp/final-shipped-test.txt 2>&1
          CODE=$?
          set -e
          cat /tmp/final-shipped-test.txt
          echo "exit=$CODE"
          if [ "$CODE" -eq 4 ]; then echo "FAIL: ffmpeg startup gate not passed on shipped tarball"; exit 1; fi
          grep -q "ffmpeg/bin/ffmpeg" /tmp/final-shipped-test.txt || { echo "FAIL: bundled ffmpeg path not used"; exit 1; }
          grep -q "9\.0\." /tmp/final-shipped-test.txt || { echo "FAIL: expected bundled 9.x version"; exit 1; }
          if grep -q "/opt/homebrew" /tmp/final-shipped-test.txt; then echo "FAIL: Homebrew ffmpeg leaked in"; exit 1; fi
          grep -q 'Name = "OnlyFans"' /tmp/final-test/config.conf || { echo "FAIL: shipped config missing OnlyFans"; exit 1; }
          echo "OK: shipped tarball works standalone with bundled ffmpeg"
          # Simulate Finder double-click: run the .command launcher from a DIFFERENT cwd
          # (Finder opens .command files with cwd=$HOME, not the package dir)
          cd /tmp
          rm -f /tmp/config.conf
          set +e
          "/tmp/final-test/SubScraper - Classic.command" --non-interactive > /tmp/command-test.txt 2>&1
          COMMAND_CODE=$?
          set -e
          cat /tmp/command-test.txt
          echo "launcher exit=$COMMAND_CODE"
          if [ "$COMMAND_CODE" -eq 4 ]; then echo "FAIL: launcher did not pass ffmpeg gate"; exit 1; fi
          grep -q "ffmpeg/bin/ffmpeg" /tmp/command-test.txt || { echo "FAIL: launcher did not use bundled ffmpeg"; exit 1; }
          grep -q "9\.0\." /tmp/command-test.txt || { echo "FAIL: launcher did not detect 9.x"; exit 1; }
          test ! -f /tmp/config.conf || { echo "FAIL: launcher created stray config.conf in wrong cwd"; exit 1; }
          echo "OK: double-click launcher works (correct cwd, bundled ffmpeg, no stray files)"
          # Interactive run via the launcher, like a real Finder double-click:
          # the browser auth flow must trigger (no display in CI, so we only
          # check that the flow starts).
          cd /tmp
          "/tmp/final-test/SubScraper - Classic.command" < /dev/null > /tmp/command-interactive-test.txt 2>&1 &
          LAUNCHER_PID=$!
          EXITED_EARLY=0
          for i in $(seq 1 90); do
            if ! kill -0 $LAUNCHER_PID 2>/dev/null; then
              EXITED_EARLY=1
              break
            fi
            sleep 1
          done
          if [ "$EXITED_EARLY" -eq 1 ]; then
            echo "DIAG: launcher exited on its own before 90s (did NOT wait for login - launch or navigation failed fast)"
          else
            echo "DIAG: launcher still running at 90s -> browser was open and waiting for login (killing for CI)"
          fi
          kill $LAUNCHER_PID 2>/dev/null || true
          wait $LAUNCHER_PID 2>/dev/null || true
          cat /tmp/command-interactive-test.txt
          echo "=== app log (Serilog appends date: SubScraperYYYYMMDD.txt) ==="
          LOGFILE=$(ls -t /tmp/final-test/logs/SubScraper*.txt 2>/dev/null | head -1)
          if [ -n "$LOGFILE" ]; then
            echo "Log file: $LOGFILE"
            grep -E "Chromium already downloaded|Failed to download browser|Navigating to configured site|Waiting for user to login|Error getting auth from browser" "$LOGFILE" | tail -20
            echo "--- exception detail (30 lines from first [ERR]) ---"
            grep -A 25 "\[ERR\]" "$LOGFILE" | head -30
            echo "--- playwright browser cache ---"
            ls -d ~/.cache/ms-playwright/chromium-* ~/Library/Caches/ms-playwright/chromium-* 2>/dev/null || echo "(no playwright chromium found in cache dirs)"
          else
            echo "(no log file found in /tmp/final-test/logs/)"
          fi
          if grep -q "Preparing the browser" /tmp/command-interactive-test.txt; then
            echo "OK: double-click launcher triggers browser auth flow (headful launch attempted - no display in CI as expected)"
          else
            echo "FAIL: launcher did not trigger browser auth flow"
            exit 1
          fi

      - name: Create GitHub Release (direct .tar.gz download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.13-macos-arm64"
          cd "$GITHUB_WORKSPACE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG"
            gh release delete "$TAG" -y --cleanup-tag
          fi
          gh release create "$TAG" \
            --title "SubScraper v1.0.13 macOS Apple Silicon" \
            --notes "SubScraper for macOS 13+ (Apple Silicon arm64). Contents: SubScraper.app (GUI), SubScraper Classic (CLI) + double-click launcher, bundled ffmpeg/ffprobe 9.0.2 arm64, OnlyFans site config, CDM device keys. Install: tar -xzf SubScraperV1.0.13-osx-arm64.tar.gz" \
            SubScraperV1.0.13-osx-arm64.tar.gz
          echo "Direct download: https://github.com/Lkas2412/subscrapper/releases/download/$TAG/SubScraperV1.0.13-osx-arm64.tar.gz"
